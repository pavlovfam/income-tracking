<style>html{color-scheme:light}body{margin:0}
/* Layout: sticky header with year switcher + tabs; month cards (details) per section; summary table with annual totals. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --surface:#17252d; --surface2:#1e3039; --ink:#e4eef2; --ink2:#8ea8b4; --line:#2b414c;
  --accent:#4fc1ba; --accent-ink:#06201f; --pos:#5ed39a; --neg:#ff8b7c; --focus:#6fd6cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#17252d; --surface2:#1e3039; --ink:#e4eef2; --ink2:#8ea8b4; --line:#2b414c;
  --accent:#4fc1ba; --accent-ink:#06201f; --pos:#5ed39a; --neg:#ff8b7c; --focus:#6fd6cf; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 0;border-bottom:1px solid var(--line)}

.year button:hover{background:var(--surface2)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:0 2px;margin-top:4px}

@media (min-width:760px){nav{display:flex;gap:2px}nav button{padding:8px 14px;font-size:14px}
nav button[data-tab=sum]{order:1}nav button[data-tab=tithe]{order:2}nav button[data-tab=rent]{order:3}nav button[data-tab=salary]{order:4}nav button[data-tab=interest]{order:5}nav button[data-tab=other]{order:6}nav button[data-tab=util]{order:7}nav button[data-tab=settings]{order:8}}

.note{color:var(--ink2);font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}

.mname{font-weight:600;min-width:84px}

label{display:grid;gap:3px;font-size:12px;color:var(--ink2)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
input[inputmode=decimal]{font-family:var(--mono)}
label.wide{grid-column:1/-1}
.grp{border-left:3px solid var(--accent);padding-left:8px;margin:12px 0;display:grid;gap:8px}
.grp-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px;color:var(--ink2)}.grp-h b{color:var(--ink);font-size:14px}.grp-h .gsum{margin-left:auto;font-family:var(--mono);color:var(--ink)}
.chips{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.chips.on{display:flex}

textarea.note1{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0;display:block;resize:none;overflow:hidden;white-space:pre}
textarea.note1.open{white-space:pre-wrap;overflow-wrap:anywhere}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);align-self:end;padding-bottom:7px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700;margin:10px 0 -4px;padding-top:14px;border-top:1px solid var(--line)}
.body>.sec:first-child{border-top:0;padding-top:0;margin-top:2px}
.sec.nb{border:0;padding:0;margin:0}
.incbox{background:color-mix(in srgb,var(--pos) 9%,transparent);border-radius:10px;padding:10px;display:grid;gap:10px;margin-top:6px}
.g6{grid-template-columns:repeat(6,1fr)!important}.g6>:nth-child(-n+2){grid-column:span 3}.g6>:nth-child(n+3){grid-column:span 2}
.g3{grid-template-columns:repeat(3,1fr)!important}
.res .total{grid-column:1/-1}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.res div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.res small{display:block;font-size:11px;color:var(--ink2)}
.res output{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.res .big output{color:var(--pos)}
.neg{color:var(--neg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
td{font-family:var(--mono);font-size:13px}td:first-child{font-family:var(--sans)}
tfoot td{font-weight:600;border-bottom:0;background:var(--surface2)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tot .card{padding:12px 14px}
.tot h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tot p{margin:0;font-family:var(--mono);display:flex;justify-content:flex-end;gap:6px}.tot p .s{width:1.1em;text-align:left;color:var(--ink2)}
.tot .all{border-color:var(--accent)}
.add,.del{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500;justify-self:start}
.del{color:var(--neg);padding:5px 10px;font-size:12px;justify-self:end}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
#status{font-size:11px;font-weight:400;color:var(--ink2)}
.xs{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:500}
.tot .all .v{font-weight:700}.tot .dim p{color:var(--ink2)}.tot .dim{background:transparent}
.cl.pay label{width:132px}.cl.pay .del{margin-left:auto}
@media (max-width:520px){.sum{margin-left:0;width:100%;text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.res output{font-weight:400}.res .cc output{color:var(--ink2)}.res .cc.src output{font-weight:700;color:var(--ink)}
.incard .res .cc.src output{color:var(--pos)}
.res .big output{color:var(--pos)}.res .big.cc output{color:var(--ink2)}.res .big.cc.src output{color:var(--pos)}
.res .cc:not(.src) small{opacity:.8}
.incard>summary{flex-wrap:nowrap}.in-main{flex:1;min-width:0;display:grid;gap:1px}.in-main .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in-main .meta{color:var(--ink2);font-size:12px}.in-amt{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.g2{grid-template-columns:1fr 1fr!important;align-items:start}.g2 label{align-self:start}
.grid>div{background:var(--surface2);border-radius:8px;padding:8px 10px;align-self:end}.grid>div small{display:block;font-size:11px;color:var(--ink2)}.grid>div output{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ratewarn{grid-column:1/-1;font-size:12px;color:var(--neg)}.ratewarn:empty{display:none}
td.src{font-weight:700}
tr:has(td.src) td:not(.src):not(:first-child){color:var(--ink2)}
.pend{font-size:12px;color:var(--ink2)}.pend.warn{color:var(--neg)}.pend.ok{color:var(--pos)}
.strow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;align-items:end}.strow>*{min-width:0}.strow input,.strow select{min-width:0;max-width:100%;width:100%;box-sizing:border-box}.strow input[type=checkbox]{width:18px}input[type=date]{min-width:0;max-width:100%}
.strow+.strow{border-top:1px solid var(--line);padding-top:12px}
.strow>.sn{grid-column:1;grid-row:1}.strow>.sa,.strow>label:not(.chk):not(.sk){grid-column:2;grid-row:1}
.strow .pd>label.chk{grid-column:1;grid-row:2}.strow .pd>label:not(.chk){grid-column:2;grid-row:2/span 2}
.strow>.sk{grid-column:1;grid-row:3;align-self:start}.strow.skip>.sk{grid-row:2}
.strow>label,.strow .pd>label{width:auto}.strow .pd{display:contents}.strow.skip .pd{display:none}.strow.paid .sk{display:none}.sn{font-weight:600;padding-bottom:7px}.sa.big{font-weight:700}.mine{gap:8px 12px;padding:4px 0}.mine .chk{padding-bottom:0;align-self:start}.sa{font-family:var(--mono);padding-bottom:7px;text-align:right}
.raw{margin:0;padding:10px 14px;font-size:13px;color:var(--ink2)}.raw b{font-family:var(--mono);color:var(--ink);font-weight:500}
.cl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}.cl b{font-family:var(--mono);min-width:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px}.row label{width:130px}
.panel{padding:14px;display:grid;gap:10px}.panel h2{margin:0;font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
@media (max-width:760px){input,select,textarea,textarea.note1,.year select{font-size:16px}input[type=checkbox]{font-size:inherit}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>Учет доходов <span id="status"></span></h1>
    <div class="top-r"><div class="year"><select id="ys" aria-label="Год"></select></div></div>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var MOG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var DEF=[{code:'RUB',sym:'₽',on:true},{code:'USD',sym:'$',on:true},{code:'KZT',sym:'₸',on:true}];
var settings={cur:DEF.map(function(x){return{code:x.code,sym:x.sym,on:x.on}})};
var year=new Date().getFullYear(),tab='sum',Y=null,db=null,uid=null,timers={},dlcap=null,pendingImport=null,PU=[],payOpen=false,openInc={};
var TABS=[['sum','Сводка'],['tithe','Десятина'],['util','Коммуналка'],['settings','Настройки'],['rent','Аренда'],['salary','Зарплата'],['interest','Вклады'],['other','Прочее']];
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[\s\u00a0]/g,'').replace(',','.'));return isFinite(n)?n:0}
function has(v){return v!==null&&v!==undefined&&v!==''}
function fin(x){return isFinite(x)?x:0}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sym(c){for(var i=0;i<settings.cur.length;i++)if(settings.cur[i].code===c)return settings.cur[i].sym;return c}
function act(){return settings.cur.filter(function(x){return x.on}).map(function(x){return x.code})}
function fmt(n,c){if(!isFinite(n))return '—';var s=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);return c?s+' '+sym(c):s}

/* Курсы: сколько единицы валюты за 1 $. Любая сумма -> доллары -> остальные валюты. Нет курса -> NaN (в интерфейсе прочерк). */
function fillCross(rates){
  var r=rates||{},x=num(r.KZT_RUB);if(!x)return r;
  var rub=num(r.RUB),kzt=num(r.KZT);
  if(!rub&&kzt){r=Object.assign({},r);r.RUB=kzt/x}else if(!kzt&&rub){r=Object.assign({},r);r.KZT=rub*x}
  return r;
}
function conv(a,cur,rates){
  a=num(a);rates=fillCross(rates);var usd;
  if(cur==='USD')usd=a;else{var r=num(rates[cur]);usd=r?a/r:NaN}
  var out={USD:usd};
  settings.cur.forEach(function(x){var c=x.code;if(c==='USD')return;var r=num(rates[c]);out[c]=r?usd*r:NaN});
  out[cur]=a;return out;
}
function mig(o){if(!o.rates){o.rates={};if(has(o.usdRub))o.rates.RUB=o.usdRub;if(has(o.usdKzt))o.rates.KZT=o.usdKzt}return o}
function blankYear(){var r=[],u=[];for(var i=0;i<12;i++){r.push({cur:'RUB',taxPct:'4',rates:{}});u.push({})}return{rent:r,util:u,inc:[],tithe:{main:'',pays:[]}}}
function commaNums(o){
  if(!o||typeof o!=='object')return;
  Object.keys(o).forEach(function(k){var v=o[k];
    if(typeof v==='string'){if(k!=='name'&&k!=='maintNote'&&k!=='otherNote'&&/^-?\d+\.\d+$/.test(v))o[k]=v.replace('.',',')}
    else if(v&&typeof v==='object')commaNums(v)});
}
function normY(d){
  var b=blankYear();d=d||{};
  if(d.rent&&d.rent.length===12)b.rent=d.rent;if(d.util&&d.util.length===12)b.util=d.util;b.inc=d.inc||[];b.tithe=(d.tithe&&d.tithe.pays)?d.tithe:{main:'',pays:[]};
  b.rent.forEach(function(m,i){mig(m);if(has(m.inet)&&!has(b.util[i].inet))b.util[i].inet=m.inet;delete m.inet});
  b.util.forEach(function(u){
    if(!u.payFix){if(u.payPaid===true&&u.iPaid&&!u.wPaid&&!u.ePaid&&(u.payDate||'')===(u.iDate||'')){u.payPaid=false;u.payDate=''}u.payFix=1}
    if(u.payPaid===undefined&&u.paySkip===undefined){if(u.wPaid||u.ePaid){u.payPaid=true;u.payDate=u.wDate||u.eDate||''}else if(u.wSkip&&u.eSkip&&u.iSkip)u.paySkip=true}});
  b.inc.forEach(mig);commaNums(b.rent);commaNums(b.util);commaNums(b.inc);commaNums(b.tithe.pays);return b;
}
function normSettings(s){
  var out=DEF.map(function(x){return{code:x.code,sym:x.sym,on:true}});
  if(s&&s.cur){s.cur.forEach(function(x){var f=null;out.forEach(function(o){if(o.code===x.code)f=o});
    if(f){if(x.code==='KZT')f.on=x.on!==false}else if(x.code)out.push({code:x.code,sym:x.sym||x.code,on:x.on!==false})})}
  return{cur:out,lastBackup:+(s&&s.lastBackup)||0,since:+(s&&s.since)||0,names:(s&&s.names&&Array.isArray(s.names.interest))?{interest:s.names.interest.slice(0,40)}:{interest:[]}};
}
/* Хранение: db (личные данные viewer-а) или localStorage */
function lsKey(id){return id==='settings'?'income-settings':'income-'+id.slice(1)}
function parse(s){try{return s?JSON.parse(s):null}catch(e){return null}}
function readDoc(id,cb){
  if(db&&uid){db.collection('data/users/'+uid).doc(id).get().then(function(s){cb(s.exists?parse(s.data().json):null)},function(){cb(null)});return}
  try{cb(parse(localStorage.getItem(lsKey(id))))}catch(e){cb(null)}
}
function writeDoc(id,obj,ok,bad){
  var snap=JSON.stringify(obj);
  if(db&&uid){db.collection('data/users/'+uid).doc(id).set({json:snap}).then(ok,bad);return}
  try{localStorage.setItem(lsKey(id),snap);ok()}catch(e){bad()}
}
function setStatus(t){var s=document.getElementById('status');if(s)s.textContent=t?'· '+t:''}
function saveSoon(id,getter){
  clearTimeout(timers[id]);setStatus('…');
  timers[id]=setTimeout(function(){writeDoc(id,getter(),function(){setStatus('сохранено')},function(){setStatus('не сохранено')})},600);
}
function saveYear(){var y=year,d=Y;saveSoon('y'+y,function(){return d})}
function saveSettings(){saveSoon('settings',function(){return settings})}
function loadYear(y,cb){readDoc('y'+y,function(d){Y=normY(d);readDoc('y'+(y-1),function(p){PU=normY(p).util;cb()})})}

/* Коммуналка */
function ut(i,f){var u=Y.util[i];return u&&has(u[f])?u[f]:''}
function tariff(i,f){for(var j=i;j>=0;j--){if(has(Y.util[j][f]))return Y.util[j][f]}for(var k=PU.length-1;k>=0;k--){if(has(PU[k][f]))return PU[k][f]}return ''}
function prevR(i,k){if(has(ut(i,k+'P')))return ut(i,k+'P');if(i>0)return has(Y.util[i-1][k+'C'])?Y.util[i-1][k+'C']:'';return PU.length===12&&has(PU[11][k+'C'])?PU[11][k+'C']:''}
var RD=['cwC','hwC','e1C','e2C','e3C'];
function hasData(i){return has(Y.rent[i].amount)||has(ut(i,'inet'))||RD.some(function(k){return has(ut(i,k))})}
function line(i,k,tf){var p=num(prevR(i,k)),c=num(ut(i,k+'C')),use=has(ut(i,k+'C'))?c-p:0;return{use:use,sum:use*num(tariff(i,tf))}}
function utilCalc(i){
  var cold=line(i,'cw','cwT'),hot=line(i,'hw','hwT');

    var tc=titheCalc();tc.L.forEach(function(c){D.push([yn,tc.main,c,nv(tc.due[c]),c===tc.main?tc.paid:'',nv(tc.leftC[c])])});
    titheData().pays.forEach(function(q){P.push([yn,q.date||'',num(q.amount),q.cur||'',(tc.main&&q.cur!==tc.main)?n2(q.credit):'',tc.main])});
    Y.rent.forEach(function(m,i){var c=rentCalc(i),r=Y.util[i];if(!c.a&&!has(m.jkh)&&!has(m.maint)&&!has(m.other))return;
      A.push([yn,MON[i],m.date||'',c.a,m.cur].concat(NU.map(function(k){return n2((m.rates||{})[k])}),[n2(m.taxPct),c.tax,n2(m.jkh),c.water,c.elec,n2(tariff(i,'inet')),n2(m.maint),m.maintNote||'',n2(m.other),m.otherNote||'',c.exp,c.net],L.map(function(k){return nv(c.netC[k])}),[r.payPaid?'да':(r.paySkip?'не нужно':'нет'),r.payDate||'',r.payTold?'да':'нет',r.inetMine?'да':'нет']))});
    Y.inc.forEach(function(x){var c=conv(x.amount,x.cur,x.rates);I.push([yn,KN[x.kind]||x.kind,x.date||'',x.name||'',num(x.amount),x.cur].concat(NU.map(function(k){return n2((x.rates||{})[k])}),L.map(function(k){return nv(c[k])})))});
    Y.util.forEach(function(r,i){var u=utilCalc(i);if(!hasData(i))return;
      U.push([yn,MON[i],n2(prevR(i,'cw')),n2(r.cwC),n2(tariff(i,'cwT')),u.cold.sum,n2(prevR(i,'hw')),n2(r.hwC),n2(tariff(i,'hwT')),u.hot.sum,u.sewUse,n2(tariff(i,'swT')),u.sew,u.water,
        n2(prevR(i,'e1')),n2(r.e1C),n2(tariff(i,'e1T')),u.t1.sum,n2(prevR(i,'e2')),n2(r.e2C),n2(tariff(i,'e2T')),u.t2.sum,n2(prevR(i,'e3')),n2(r.e3C),n2(tariff(i,'e3T')),u.t3.sum,u.el,n2(tariff(i,'inet')),payCalc(i).total])});
  });
  Y=keep;
  [['Аренда',A],['Доходы',I],['Коммуналка',U],['Десятина',D],['Оплаты десятины',P]].forEach(function(s){var ws=XLSX.utils.aoa_to_sheet(s[1]);ws['!cols']=s[1][0].map(function(h){return{wch:Math.max(12,String(h).length+2)}});XLSX.utils.book_append_sheet(wb,ws,s[0])});
  var json=JSON.stringify({app:'uchet-dohodov',v:2,settings:settings,years:years}),rows=[];
  for(var p=0;p<json.length;p+=30000)rows.push([json.slice(p,p+30000)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'_data');
  wb.Workbook={Sheets:wb.SheetNames.map(function(n){return n==='_data'?{Hidden:1}:{}})};
  return wb;
}
function saveFile(name,buf,done){
  if(dlcap){dlcap.save({filename:name,data:buf}).then(function(){setStatus('копия сохранена');markBackup();done()},function(e){if(!e||e.code!=='declined')setStatus('не удалось сохранить копию');done()});return}
  if(navigator.standalone&&navigator.canShare){try{var MT='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',fl=new File([buf],name,{type:MT});if(navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).then(function(){setStatus('копия сохранена');markBackup();done()},function(){done()});return}}catch(e){}}
  try{var bl=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();setStatus('копия сохранена');markBackup()}catch(e){setStatus('не удалось сохранить копию')}
  done();
}
function doExport(){
  if(!window.XLSX){setStatus('библиотека Excel не загрузилась');return}
  allYears(function(ys){
    try{var buf=XLSX.write(buildWb(ys),{type:'array',bookType:'xlsx'}),d=new Date();
      saveFile('uchet-dohodov-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.xlsx',buf,function(){})}
    catch(e){setStatus('ошибка при создании копии')}
  });
}
function readImport(file){
  var box=document.getElementById('impmsg');pendingImport=null;
  var fr=new FileReader();
  fr.onload=function(){
    try{var wb=XLSX.read(fr.result,{type:'array'}),ws=wb.Sheets['_data'];if(!ws)throw 0;
      var json=XLSX.utils.sheet_to_json(ws,{header:1}).map(function(r){return r[0]||''}).join(''),obj=JSON.parse(json);
      if(obj.app!=='uchet-dohodov'||!obj.years)throw 0;
      pendingImport=obj;var ys=Object.keys(obj.years).sort().join(', ');
      box.innerHTML='<p>В файле найдены годы: <b>'+esc(ys)+'</b>. Записи этих лет и список валют будут заменены данными из файла. Другие годы не изменятся.</p><button class="btn pri" data-act="impok">Заменить данные</button> <button class="btn" data-act="impcancel">Отмена</button>'}
    catch(e){box.innerHTML='<p class="neg">Это не резервная копия приложения. Выберите файл .xlsx, который сделало «Учет доходов».</p>'}
  };
  fr.readAsArrayBuffer(file);
}
function applyImport(){
  var obj=pendingImport;if(!obj)return;pendingImport=null;
  var ids=Object.keys(obj.years),left=ids.length+1,bad=false;
  function one(){if(--left===0){settings=normSettings(obj.settings);settings.lastBackup=Date.now();saveSettings();loadYear(year,function(){render();setStatus(bad?'часть данных не восстановлена':'данные восстановлены')})}}
  writeDoc('settings',normSettings(obj.settings),one,function(){bad=true;one()});
  ids.forEach(function(y){writeDoc('y'+y,normY(obj.years[y]),one,function(){bad=true;one()})});
}
function setYear(y){if(!y||y===year)return;year=y;payOpen=false;openInc={};Y=null;render();loadYear(year,render)}
document.getElementById('ys').onchange=function(){setYear(+this.value)};
function start(){
  readDoc('settings',function(s){settings=normSettings(s);if(!settings.lastBackup&&!settings.since){settings.since=Date.now();saveSettings()}loadYear(year,render)});
  if(window.claude&&claude.use)claude.use('downloads').then(function(d){dlcap=d},function(){});
}
render();
var cl=window.claude;
if(cl&&cl.use){
  var to=new Promise(function(r){setTimeout(function(){r([null,null])},4000)});
  Promise.race([Promise.all([cl.use('db'),cl.use('user')]),to]).then(function(a){
    db=a[0];var us=a[1];
    if(db&&us){us.id().then(function(id){uid=id;start()},start)}else start()
  },start);
}else start();
})();
</script>
